<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Mapa con Leaflet</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <!-- MarkerCluster -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css" />
  <script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>

  <style>
    #map { height: 100vh; }
    .tooltip-circuito {
      background-color: rgba(255, 255, 255, 0.6);
      border: 1px solid #333;
      padding: 2px 4px;
      font-weight: bold;
      color: #000;
    }
  </style>
</head>
<body>

<div id="map"></div>

<script>
  const map = L.map('map').setView([-27.45059, -58.987993], 10);

  // Base map
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors'
  }).addTo(map);

  const capaCircuitos = L.layerGroup();
  const capaBarrios = L.layerGroup();

  // Circuitos
  fetch('https://raw.githubusercontent.com/cdlezana/Electoral_rcia/refs/heads/cdlezana-patch-1/Circuitos_elect_rcia_2019.geojson')
    .then(res => res.json())
    .then(data => {
      L.geoJSON(data, {
        style: { color: 'blue', weight: 3, fillOpacity: 0.2 },
        onEachFeature: (feature, layer) => {
          const nombre = feature.properties?.CIRCUITO || 'Circuito';
          layer.bindTooltip(`<strong>${nombre}</strong>`, {
            permanent: true,
            direction: 'center',
            className: 'tooltip-circuito'
          });
        }
      }).addTo(capaCircuitos);
    });

  // Barrios
  fetch('https://raw.githubusercontent.com/cdlezana/Electoral_rcia/refs/heads/cdlezana-patch-1/barrios_rcia_4326.geojson')
    .then(res => res.json())
    .then(data => {
      L.geoJSON(data, {
        style: { color: 'green', weight: 2, fillOpacity: 0.4 },
        onEachFeature: (feature, layer) => {
          const nombre = feature.properties?.Barrio || 'Barrio';
          layer.on('click', () => {
            layer.bindTooltip(`<strong>${nombre}</strong>`, {
              direction: 'top',
              sticky: true
            }).openTooltip();
          });
        }
      }).addTo(capaBarrios);
    });

  capaCircuitos.addTo(map);
  capaBarrios.addTo(map);

  // Capas control
  L.control.layers({}, {
    "Circuitos": capaCircuitos,
    "Barrios": capaBarrios
  }).addTo(map);

  // Clustering de puntos
  fetch('https://raw.githubusercontent.com/cdlezana/Electoral_rcia/refs/heads/cdlezana-patch-1/Esc_rcia_padron_25.geojson')
    .then(res => res.json())
    .then(data => {
      const markers = L.markerClusterGroup({
        iconCreateFunction: cluster => {
          let totalMesas = 0;
          cluster.getAllChildMarkers().forEach(marker => {
            totalMesas += marker.options.mesas || 0;
          });

          // Gama de colores
          let color = 'green';
          if (totalMesas > 40) color = 'red';
          else if (totalMesas > 10) color = 'orange';
          else if (totalMesas > 5) color = 'yellow';

          return L.divIcon({
            html: `<div style="background-color: ${color}; border-radius: 50%; padding: 10px; border: 2px solid #555; color: black;"><strong>${totalMesas}</strong></div>`,
            className: 'custom-cluster',
            iconSize: L.point(40, 40)
          });
        }
      });

      data.features.forEach(f => {
        const coords = f.geometry.coordinates;
        const latlng = L.latLng(coords[1], coords[0]);
        const mesas = Number(f.properties.Mesas) || 0;
        const marker = L.marker(latlng, { mesas: mesas });

        let popup = `<strong>Mesas:</strong> ${mesas}<br>`;
        for (const [key, value] of Object.entries(f.properties)) {
          if (key !== 'Mesas') popup += `<strong>${key}:</strong> ${value}<br>`;
        }
        marker.bindPopup(popup);

        markers.addLayer(marker);
      });

      map.addLayer(markers);
    })
    .catch(err => console.error('Error cargando puntos:', err));
</script>

</body>
</html>
